<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widhth=device-width-device, initial-scale=1.0">
    <title>contact Us</title>
  </head>
  <body>
    <header>
      <h1>Contact Us</h1>
    </header>
    <main>
      <form>
        <feildset>
          <legend>Personal info</legend>
          <label for="FullName">FullName:</label>
          <input type="text" id="FullName" name="FullName" placeholder="Enter your full name" required><br>
           <label for="Email">Email:</label>
          <input type="text" id="Email" name="Email" placeholder="eg.example@gmail.com" required><br>
           <label for="phone">Phone(optional):</label>
          <input type="tel" id="phone" name="phone" placeholder="eg.0712345678">
        </feildset>
        <feildset>
          <legend>Your Message</legend>
          <label for="subject">Subject</label>
          <select id="subject" name="subject">
            <option value="general">General Inquiry</option>
            <option value="support">Support</option>
            <option value="feedback">Inquiry</option>
          </select><br>
          <label for="messages">Message(minimum 50 characters)</label>
          <textarea id="message" name="messages" minlength="50" placeholder="Type your message here" required></textarea>
        </fieldset>
        <fieldset>
          <legend>Prefferences</legend>
          <input type="checkbox" id="newsletter" name="newsletter" value="yes">
          <label>Subscribe to newsletter</label>
        </feildset>
        <button type="submit">Submit</button>
      </form>
    </main>
    <footer>
      <p>&copy; Joepavin 2026</p>
    </footer>
  </body>
</html>
